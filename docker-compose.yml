services:
  daily-wechat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TZ: Asia/Shanghai
      MORNING_TIME: "08:00"
      EVENING_TIME: "18:00"
      RUST_LOG: info
    volumes:
      - daily_wechat_data:/data
volumes:
  daily_wechat_data:
